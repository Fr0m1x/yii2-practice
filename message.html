<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сообщения</title>
    <link rel="stylesheet" href="assets/styles/style.css">
</head>
<body>
    <header class="appbar">
        <span class="appbar__title">Кабинет</span>
        <a href="profile.html" class="appbar__avatar">ИФ</a>
    </header>

    <nav class="tabbar">
        <a href="profile.html" class="tabbar__item">Профиль</a>
        <a href="stats.html" class="tabbar__item">Статистика</a>
        <a href="message.html" class="tabbar__item is-current">Сообщения</a>
    </nav>

    <main class="page">
        <section class="card">
            <h1 class="card__heading">Новое сообщение</h1>

            <form class="compose" action="">
                <div class="compose__row">
                    <input class="compose__field" type="text" placeholder="Кому">
                    <input class="compose__field" type="text" placeholder="От кого">
                </div>
                <textarea class="compose__textarea" placeholder="Текст сообщения…"></textarea>

                <div class="compose__footer">
                    <button class="compose__submit" type="submit">Отправить</button>
                    <a href="#" class="link-more">Все сообщения →</a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
