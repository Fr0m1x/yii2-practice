<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сообщения — Личный кабинет</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">

    <aside class="sidebar">
      <div class="sidebar__brand">
        <span class="sidebar__mark" aria-hidden="true"></span>
        <span>
          <span class="sidebar__title">Личный кабинет</span>
          <span class="sidebar__subtitle">Сервис сообщений</span>
        </span>
      </div>

      <nav class="sidebar__nav" aria-label="Основная навигация">
        <a class="sidebar__link is-active" href="index.html">
          <svg class="sidebar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v11H7l-3 3V5z"/></svg>
          Сообщения
        </a>
        <a class="sidebar__link" href="stats.html">
          <svg class="sidebar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>
          Статистика
        </a>
      </nav>

      <div class="sidebar__footer">
        <span class="sidebar__avatar">ВТ</span>
        <span class="sidebar__user">
          <span class="sidebar__name">Валерия Тюменцева</span>
          <span class="sidebar__role">Оператор</span>
        </span>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div>
          <h1 class="topbar__title">Сообщения</h1>
          <p class="topbar__hint">Отправляйте новые сообщения и следите за входящими</p>
        </div>
      </header>

      <main class="content">
        <div class="messages-layout">

          <section class="panel compose">
            <h2 class="panel__title" style="margin-bottom: 16px;">Новое сообщение</h2>

            <form id="compose-form">
              <div class="field">
                <label class="field__label" for="recipient">Получатель</label>
                <input class="field__control" type="text" id="recipient" name="recipient" placeholder="Имя или номер" required>
              </div>

              <div class="field">
                <label class="field__label" for="message-text">Текст сообщения</label>
                <textarea class="field__control" id="message-text" name="message-text" rows="5" placeholder="Введите сообщение…" required></textarea>
              </div>

              <button class="btn btn--primary compose__submit" type="submit">Отправить сообщение</button>
            </form>
          </section>

          <section class="panel feed">
            <div class="panel__header">
              <h2 class="panel__title">Лента</h2>
              <span class="panel__meta" id="feed-meta">0 записей</span>
            </div>

            <ul class="feed__list" id="feed-list"></ul>

            <p class="feed__empty" id="feed-empty" style="display: none;">
              Пока нет ни одного сообщения. Отправьте первое или дождитесь входящего.
            </p>
          </section>

        </div>
      </main>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/messages.js"></script>
</body>
</html>
